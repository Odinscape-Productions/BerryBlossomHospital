name = "berry-blossom-quiz"
main = "secure-quiz-worker.js"
compatibility_date = "2026-09-01"

[vars]
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR_PUBLIC_ANON_KEY"
# Set SUPABASE_SERVICE_ROLE_KEY as an encrypted Worker secret, never in this file.

[[kv_namespaces]]
binding = "QUIZ_BANK"
id = "YOUR_KV_NAMESPACE_ID"
